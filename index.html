
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Envío de documentos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .contenedor {
      max-width: 600px;
      margin: 35px auto;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #173b67;
      margin-bottom: 10px;
    }

    .descripcion {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 8px;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      outline: 2px solid #93c5fd;
      border-color: #2563eb;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .zona-archivos {
      padding: 20px;
      background: #f8fafc;
      border: 2px dashed #94a3b8;
      border-radius: 10px;
      text-align: center;
    }

    .zona-archivos input {
      border: none;
      padding: 10px 0;
    }

    .ayuda {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }

    #listaArchivos {
      margin-top: 15px;
      padding: 0;
      list-style: none;
    }

    #listaArchivos li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px;
      margin: 7px 0;
      background: #f1f5f9;
      border-radius: 7px;
      overflow-wrap: anywhere;
    }

    .eliminar {
      color: #dc2626;
      background: transparent;
      border: none;
      cursor: pointer;
      font-weight: bold;
      padding: 5px;
    }

    .boton {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      background: #173b67;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .boton:hover {
      background: #24558b;
    }

    .boton:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    #estado {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
      line-height: 1.5;
    }

    .seguridad {
      margin-top: 25px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }

    /* Campo invisible antispam */
    .campo-oculto {
      position: absolute;
      left: -10000px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <h1>Envío de documentos</h1>

    <p class="descripcion">
      Completa tus datos y adjunta los documentos
      que deseas enviar.
    </p>

    <form id="formulario">

      <label for="nombre">Nombre completo *</label>

      <input
        type="text"
        id="nombre"
        maxlength="100"
        placeholder="Escribe tu nombre"
        required
      >

      <label for="mensaje">Comentarios</label>

      <textarea
        id="mensaje"
        maxlength="1000"
        placeholder="Escribe algún comentario adicional..."
      ></textarea>

      <label for="archivos">Adjuntar documentos *</label>

      <div class="zona-archivos">

        <input
          type="file"
          id="archivos"
          accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx"
          multiple
          required
        >

        <p class="ayuda">
          Puedes adjuntar hasta 5 documentos.<br>
          Tamaño máximo conjunto: 5 MB.<br>
          Formatos: PDF, JPG, PNG, DOC, DOCX, XLS y XLSX.
        </p>

      </div>

      <ul id="listaArchivos"></ul>

      <!-- Campo antispam -->
      <div class="campo-oculto" aria-hidden="true">
        <label for="website">No completar</label>
        <input
          type="text"
          id="website"
          tabindex="-1"
          autocomplete="off"
        >
      </div>

      <button
        type="submit"
        class="boton"
        id="botonEnviar"
      >
        Enviar documentos
      </button>

      <p id="estado" role="status" aria-live="polite"></p>

    </form>

    <p class="seguridad">
      Los documentos serán enviados al correo
      de recepción establecido.
    </p>

  </main>

  <script>

    // DIRECCIÓN DE TU GOOGLE APPS SCRIPT
    const URL_SCRIPT =
      "https://script.google.com/a/macros/usach.cl/s/AKfycbzWCxrMBfJdT9sutTIAa8NpHwThixcyK4E4DNVyV_KPAnubqxHziAgZ9Ugiy02Pplxz/exec";

    const MAX_BYTES = 5 * 1024 * 1024;
    const MAX_ARCHIVOS = 5;

    const TIPOS = {
      pdf: "application/pdf",
      jpg: "image/jpeg",
      jpeg: "image/jpeg",
      png: "image/png",
      doc: "application/msword",
      docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
      xls: "application/vnd.ms-excel",
      xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    };

    const formulario = document.getElementById("formulario");
    const selector = document.getElementById("archivos");
    const lista = document.getElementById("listaArchivos");
    const boton = document.getElementById("botonEnviar");
    const estado = document.getElementById("estado");

    let archivosSeleccionados = [];

    // Selección de documentos
    selector.addEventListener("change", function() {

      archivosSeleccionados =
        Array.from(selector.files);

      mostrarArchivos();

    });

    // Mostrar documentos seleccionados
    function mostrarArchivos() {

      lista.innerHTML = "";

      archivosSeleccionados.forEach((archivo, indice) => {

        const elemento = document.createElement("li");
        const texto = document.createElement("span");
        const eliminar = document.createElement("button");

        texto.textContent =
          archivo.name + " (" +
          (archivo.size / 1024).toFixed(1) + " KB)";

        eliminar.textContent = "Eliminar";
        eliminar.type = "button";
        eliminar.className = "eliminar";

        eliminar.addEventListener("click", () => {

          archivosSeleccionados.splice(indice, 1);
          mostrarArchivos();

        });

        elemento.appendChild(texto);
        elemento.appendChild(eliminar);

        lista.appendChild(elemento);

      });

    }

    // Convertir archivos a Base64
    function convertirArchivo(archivo) {

      return new Promise((resolve, reject) => {

        const lector = new FileReader();

        lector.onload = function() {

          const base64 = lector.result.split(",")[1];

          const extension =
            archivo.name.split(".").pop().toLowerCase();

          const tipo =
            archivo.type || TIPOS[extension];

          resolve({
            nombre: archivo.name,
            tipo: tipo,
            data: base64
          });

        };

        lector.onerror = function() {
          reject(new Error("Error al leer " + archivo.name));
        };

        lector.readAsDataURL(archivo);

      });

    }

    // Enviar formulario
    formulario.addEventListener("submit", async function(e) {

      e.preventDefault();

      if (boton.disabled) return;

      const nombre =
        document.getElementById("nombre").value.trim();

      const mensaje =
        document.getElementById("mensaje").value.trim();

      const website =
        document.getElementById("website").value;

      if (website) {
        estado.textContent = "Solicitud rechazada.";
        return;
      }

      if (!nombre) {
        estado.textContent = "Ingresa tu nombre.";
        return;
      }

      if (
        archivosSeleccionados.length === 0 ||
        archivosSeleccionados.length > MAX_ARCHIVOS
      ) {
        estado.textContent =
          "Debes seleccionar entre 1 y 5 documentos.";
        return;
      }

      const total = archivosSeleccionados.reduce(
        (suma, archivo) => suma + archivo.size,
        0
      );

      if (total > MAX_BYTES) {
        estado.textContent =
          "El tamaño total supera los 5 MB.";
        return;
      }

      // Validar extensiones y tipos
      for (const archivo of archivosSeleccionados) {

        const extension =
          archivo.name.split(".").pop().toLowerCase();

        if (!TIPOS[extension]) {
          estado.textContent =
            "Formato no permitido: " + archivo.name;
          return;
        }

        const tipo = archivo.type || TIPOS[extension];

        if (tipo !== TIPOS[extension]) {
          estado.textContent =
            "El tipo del archivo no coincide con su extensión.";
          return;
        }

      }

      boton.disabled = true;
      estado.textContent = "Preparando documentos...";

      try {

        const archivos = await Promise.all(
          archivosSeleccionados.map(convertirArchivo)
        );

        const datos = {
          nombre: nombre,
          mensaje: mensaje,
          website: "",
          archivos: archivos
        };

        estado.textContent = "Enviando documentos...";

        // Envío a Google Apps Script
        // no-cors impide leer la respuesta del servidor.
        await fetch(URL_SCRIPT, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(datos)
        });

        estado.textContent =
          "Solicitud enviada. Verifica el correo de destino para confirmar la recepción.";

        formulario.reset();
        archivosSeleccionados = [];
        mostrarArchivos();

      } catch (error) {

        console.error(error);

        estado.textContent =
          "No se pudo enviar la solicitud. Intenta nuevamente.";

      } finally {

        boton.disabled = false;

      }

    });

  </script>

</body>
</html>
